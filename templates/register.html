{% extends "base.html" %}

{% block title %}注册 - 谜题收藏{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="card p-8">
        <h1 class="text-2xl font-bold text-center mb-6">注册</h1>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1" for="username">用户名</label>
                <input type="text" id="username" name="username" class="input" required autofocus
                       minlength="3" placeholder="至少3个字符">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1" for="password">密码</label>
                <input type="password" id="password" name="password" class="input" required
                       minlength="6" placeholder="至少6个字符">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1" for="confirm_password">确认密码</label>
                <input type="password" id="confirm_password" name="confirm_password" class="input" required>
            </div>

            <button type="submit" class="btn btn-primary w-full">注册</button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-4">
            已有账号？<a href="{{ url_for('auth.login') }}" class="text-blue-600 hover:text-blue-800">登录</a>
        </p>
    </div>
</div>
{% endblock %}
